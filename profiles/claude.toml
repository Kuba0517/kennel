extends = "base"

[fs]
read = [
    "~/.local/bin",
    "~/.local/share/claude",
    "~/.nvm/versions",
    "~/.gitconfig",
    "~/.config/git",
    "~/.claude.json",
]
read_write = [
    "~/.claude",
    "~/.claude.json",
    "~/.claude.json.backup",
    "~/.cache/claude-cli-nodejs",
    "~/.local/state/claude",
    "~/.config/claude",
]

[net]
allow_domains = ["api.anthropic.com", "claude.ai", "platform.claude.com", "console.anthropic.com"]
# claude.ai connectors (Gmail, Drive, ...); blocked with --strict
connector_domains = ["mcp-proxy.anthropic.com"]
tcp_connect = [443, 80]
tcp_bind = []

[env]
pass = ["ANTHROPIC_*", "CLAUDE_*"]
