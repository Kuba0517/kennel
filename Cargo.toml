[package]
name = "kennel"
version = "0.1.0"
edition = "2021"
description = "Landlock sandbox for AI coding agents on Linux"
license = "MIT OR Apache-2.0"
keywords = ["sandbox", "landlock", "ai-agents", "security", "least-privilege"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
landlock = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
